<style>
  /* ===== 1. Variables ===== */
  :root {
    --azul: #0073CF;
    --azul-osc: #004A8F;
    --fondo: #F4F7FB;
    --borde: #D5DEEA;
    --texto: #1B2733;
    --texto-suave: #4A5A6A;
    --error: #B3261E;
    --ok: #1B7F4B;
  }

  /* ===== 2. Base ===== */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    color: var(--texto);
    background: var(--fondo);
  }
  code, .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }

  /* ===== 3. Estructura de la página ===== */
  header { padding: 1.25rem 1rem; color: #fff; background: var(--azul); border-bottom: 6px solid var(--azul-osc); }
  header h1 { margin: 0; font-size: 1.5rem; }
  header p { margin: .25rem 0 0; opacity: .9; }

  main { display: grid; gap: 1.5rem; max-width: 960px; margin: 1.5rem auto; padding: 0 1rem; }
  section { padding: 1.25rem; background: #fff; border: 1px solid var(--borde); border-radius: 10px; }
  section h2 { margin-top: 0; font-size: 1.2rem; color: var(--azul-osc); }

  footer { padding: 1rem; text-align: center; font-size: .85rem; color: var(--texto-suave); }

  /* ===== 4. Formularios ===== */
  form { display: grid; gap: .9rem; }
  .fila { display: grid; gap: .9rem; grid-template-columns: 2fr 1fr; }
  label { display: block; margin-bottom: .25rem; font-weight: 600; }
  input[type=text], select {
    width: 100%;
    padding: .6rem .7rem;
    font: inherit;
    border: 1px solid var(--borde);
    border-radius: 6px;
  }
  input:focus, select:focus, button:focus-visible { outline: 3px solid #9CCBF2; border-color: var(--azul); }

  button {
    justify-self: start;
    padding: .65rem 1.25rem;
    font-size: 1rem;
    color: #fff;
    background: var(--azul);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: var(--azul-osc); }

  /* ===== 5. Mensajes ===== */
  .error {
    margin: 0;
    padding: .6rem .8rem;
    color: var(--error);
    background: #FDECEA;
    border: 1px solid #F5C2BE;
    border-radius: 6px;
  }
  .ok { color: var(--ok); font-weight: 600; }
  .ejemplos { margin: .25rem 0 0; font-size: .92rem; color: var(--texto-suave); }

  /* ===== 6. Tablas de resultados ===== */
  table { width: 100%; margin-top: .5rem; border-collapse: collapse; }
  th, td { padding: .5rem .6rem; text-align: left; border-bottom: 1px solid var(--borde); }
  th { color: var(--azul-osc); background: #EAF2FB; }
  .tabla-scroll { overflow-x: auto; }
  .car { font-size: 1.3rem; }

  /* ===== 7. Pantallas pequeñas ===== */
  @media (max-width: 600px) {
    .fila { grid-template-columns: 1fr; }
  }
</style>
